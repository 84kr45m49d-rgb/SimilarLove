<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>碎片 · 灯牌雨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@500;700;900&display=swap');
    :root{--cyan:#00f6ff;--pink:#ff176f;--violet:#8b4dff;--acid:#b7ff00;--bg:#03040a}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
    body{position:relative;color:#dcecff;font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;user-select:none;isolation:isolate}

.city{
  position:fixed;
  inset:0;
  z-index:-20;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 30%,rgba(38,20,90,.65),transparent 52%),
    radial-gradient(ellipse at 10% 55%,rgba(0,246,255,.16),transparent 32%),
    radial-gradient(ellipse at 90% 48%,rgba(255,23,111,.16),transparent 34%),
    linear-gradient(#010208 0%,#040714 48%,#09020d 100%);
}

.city:before{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:-3%;
  height:58%;
  opacity:.95;
  background:
    linear-gradient(
      90deg,
      transparent 0 2%,
      #070a13 2% 7%,
      transparent 7% 9%,
      #050711 9% 15%,
      transparent 15% 17%,
      #090a18 17% 22%,
      transparent 22% 25%,
      #05060f 25% 31%,
      transparent 31% 34%,
      #080914 34% 42%,
      transparent 42% 45%,
      #050711 45% 51%,
      transparent 51% 54%,
      #09091a 54% 61%,
      transparent 61% 64%,
      #05060f 64% 70%,
      transparent 70% 73%,
      #080914 73% 81%,
      transparent 81% 84%,
      #05060e 84% 92%,
      transparent 92%
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 20px,
      rgba(0,246,255,.09) 20px 22px,
      transparent 22px 42px
    );

  filter:
    drop-shadow(0 -20px 35px rgba(0,0,0,.95))
    drop-shadow(0 0 35px rgba(0,246,255,.08));

  transform:perspective(500px) rotateX(7deg);
}

.city:after{
  content:"";
  position:absolute;
  left:-10%;
  width:120%;
  bottom:-25%;
  height:50%;

  background:
    radial-gradient(
      ellipse at 20% 65%,
      rgba(0,246,255,.20),
      transparent 28%
    ),
    radial-gradient(
      ellipse at 78% 58%,
      rgba(255,23,111,.20),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 50% 80%,
      rgba(139,77,255,.15),
      transparent 38%
    ),
    linear-gradient(
      rgba(0,246,255,.18),
      rgba(0,246,255,0) 2px
    ),
    repeating-linear-gradient(
      90deg,
      rgba(0,246,255,.14) 0 1px,
      transparent 1px 90px
    );

  background-size:
    100% 100%,
    100% 100%,
    100% 100%,
    100% 48px,
    90px 100%;

  transform:
    perspective(300px)
    rotateX(58deg);

  transform-origin:bottom;

  opacity:.42;

  mask-image:
    linear-gradient(
      to top,
      black,
      transparent 82%
    );

  filter:
    blur(.2px)
    drop-shadow(0 0 18px rgba(0,246,255,.18));
}
.haze{
  position:fixed;
  inset:0;
  z-index:-10;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at 15% 55%,
      rgba(0,246,255,.13),
      transparent 30%
    ),
    radial-gradient(
      ellipse at 85% 45%,
      rgba(255,23,111,.13),
      transparent 32%
    ),
    radial-gradient(
      ellipse at 50% 70%,
      rgba(139,77,255,.10),
      transparent 40%
    );

  mix-blend-mode:screen;
  animation:haze 8s ease-in-out infinite alternate;
}
    @keyframes haze{from{opacity:.55}to{opacity:1}}
    .crt{position:fixed;inset:0;z-index:1000;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px),linear-gradient(90deg,rgba(255,0,80,.018),transparent 35%,rgba(0,240,255,.018));mix-blend-mode:screen}
    .crt:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.48) 100%)}
    .nav-bar{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:12px;padding:7px 14px;border:1px solid rgba(0,246,255,.42);border-radius:3px;background:rgba(2,5,12,.72);box-shadow:0 0 14px rgba(0,246,255,.12),inset 0 0 18px rgba(0,246,255,.035);backdrop-filter:blur(8px);font-size:11px;letter-spacing:2px;text-transform:uppercase}
    .nav-bar:before{content:"SYSTEM // ONLINE";position:absolute;left:-1px;top:-18px;color:rgba(0,246,255,.58);font-size:8px;letter-spacing:2px}
    .nav-bar a{color:#a7b7c8;text-decoration:none}.nav-bar a:hover{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
    .nav-bar .highlight{color:var(--cyan);text-shadow:0 0 8px var(--cyan),0 0 20px rgba(0,246,255,.45)}
    .side-sign{position:fixed;z-index:1;writing-mode:vertical-rl;letter-spacing:5px;font-size:10px;color:rgba(0,246,255,.45);border-left:1px solid rgba(0,246,255,.28);padding:12px 8px;text-shadow:0 0 8px currentColor;opacity:.65}
    .side-sign.left{left:18px;top:30%}.side-sign.right{right:18px;top:54%;color:rgba(255,23,111,.45);border-left-color:rgba(255,23,111,.28)}
    .rain{position:fixed;inset:-20% 0 0;z-index:0;pointer-events:none;opacity:.26;background-image:repeating-linear-gradient(108deg,transparent 0 22px,rgba(170,235,255,.22) 23px,transparent 24px 62px);background-size:130px 150px;animation:rain 1.2s linear infinite;mask-image:linear-gradient(to bottom,transparent,black 12%,black 80%,transparent)}
    @keyframes rain{to{background-position:-90px 150px}}
    .footer-note{position:fixed;left:50%;bottom:15px;transform:translateX(-50%);z-index:200;color:rgba(0,246,255,.38);font-size:8px;letter-spacing:3px;white-space:nowrap}
    .footer-note span{color:rgba(255,23,111,.55)}
.disclaimer{
  position:fixed;
  inset:0;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  padding:20px;
  box-sizing:border-box;
  text-align:center;
  color:rgba(255,255,255,.38);
  font-size:clamp(12px,1.5vw,18px);
  font-weight:500;
  line-height:1.8;
  letter-spacing:2px;
  pointer-events:none;
  text-shadow:0 0 8px rgba(255,255,255,.12);
}
    .falling-text{position:fixed;z-index:5;pointer-events:auto;font-weight:900;font-size:clamp(22px,4vw,48px);letter-spacing:2px;padding:6px 16px 7px;color:#f4f7ff;background:linear-gradient(180deg,rgba(255,255,255,.055),transparent 35%),rgba(0,2,7,.96);border:1px solid currentColor;border-radius:2px;text-shadow:0 1px 2px #000,0 0 2px currentColor,0 0 8px currentColor,0 0 20px currentColor;box-shadow:inset 0 0 22px rgba(255,255,255,.025),inset 0 0 45px rgba(0,0,0,.45),0 0 6px currentColor,0 0 18px rgba(0,0,0,.9);will-change:transform,opacity,filter;transition:filter .18s,box-shadow .18s,text-shadow .18s;clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),calc(100% - 10px) 100%,0 100%);max-width:min(80vw, 480px);word-break:break-word;white-space:normal;line-height:1.3;opacity:0}
    .falling-text{-webkit-text-stroke:.25px rgba(255,255,255,.35)}
    .falling-text:before{content:"";position:absolute;left:7px;right:7px;top:4px;height:1px;background:currentColor;opacity:.55;box-shadow:0 0 8px currentColor}
    .falling-text:after{content:"NEON//";position:absolute;right:8px;bottom:-14px;font-size:6px;letter-spacing:2px;color:currentColor;opacity:.5}
    .falling-text.flicker{animation:flicker 3.8s steps(1,end) infinite}
    @keyframes flicker{0%,7%,9%,61%,64%,100%{opacity:var(--base-opacity);filter:none}8%,62%{opacity:.18;filter:brightness(.65)}63%{opacity:.95;filter:brightness(1.8)}}
    .falling-text:hover{z-index:50;filter:brightness(1.65) saturate(1.25);text-shadow:0 1px 2px #000,0 0 3px currentColor,0 0 10px currentColor,0 0 25px currentColor,0 0 55px currentColor;box-shadow:inset 0 0 30px rgba(255,255,255,.035),0 0 15px currentColor,0 0 55px currentColor}

    @media(max-width:640px){
      .city:before{
  left:-25%;
  right:-25%;
  height:62%;
  background:
    linear-gradient(
      90deg,
      transparent 0 1%,
      #070a13 1% 9%,
      transparent 9% 12%,
      #050711 12% 23%,
      transparent 23% 27%,
      #090a18 27% 38%,
      transparent 38% 42%,
      #05060f 42% 53%,
      transparent 53% 57%,
      #080914 57% 70%,
      transparent 70% 74%,
      #050711 74% 86%,
      transparent 86% 90%,
      #080914 90% 100%
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0 14px,
      rgba(0,246,255,.09) 14px 16px,
      transparent 16px 30px
    );
}
      .nav-bar{top:10px;font-size:8px;padding:5px 10px;gap:6px;letter-spacing:1px}
      .nav-bar:before{display:none}
      .side-sign{display:none}
}
      .falling-text{font-size:clamp(16px,5vw,26px);letter-spacing:1px;padding:4px 10px 5px;max-width:min(92vw, 300px)}
      .falling-text:after{display:none}
      .footer-note{font-size:6px;bottom:8px;letter-spacing:1px}
    }
    @media(max-width:430px){
      .falling-text{font-size:clamp(14px,4.5vw,22px);padding:3px 8px 4px;max-width:min(94vw, 260px);letter-spacing:0.5px}
    }
  </style>
</head>
<body>
<div class="city"></div><div class="haze"></div><div class="rain"></div><div class="crt"></div><div class="disclaimer">
  免责声明：<br>
  ⚠️本页面所展示文本均由 AI 算法随机抽取，<br>
  不对应任何特定个人社交账号。<br>
  ⚠️本页面仅用于网页视觉效果测试，<br>
  不代表开发者本人立场。<br>
  ⚠️恶意截图、断章取义、篡改页面内容后进行的二次传播，<br>
  由传播者自行承担由此产生的一切后果。
</div>
<script>
  (function(){

    // =========================================================
    // 1. 文案池
    // =========================================================
    const quotePool = [
  "谈一个捞一个，不累吗",
  "仝和她们一起到处得罪人",
  "践踏真心的人不配被爱",
  "双标怪，只管对象特殊不管自己",
  "乡村文艺青年染黄毛骑摩托",
  "老子请你吃燕窝",
  "眼泪多的害123都溺海了",
  "手机里把她捞出来厉害死了",
  "不谈老粉不在，再谈才回来捞",
  "深海生物离开深海会被压扁",
  "之前低迷老粉去哪了",
  "下去了还是得捞",
  "某管理可不是普通老粉",
  "谁没事非得惹她啊",
  "她家gl灯牌都不高",
  "买燕窝去了",
  "奖励她们干嘛",
  "挂黑板那天人来得最齐",
  "国外的没看过",
  "到底要咯噔到什么时候",
  "黑化回归了我的妈呀",
  "正主油腻粉丝跟着油腻",
  "好xxs好中二好咯噔",
  "粉随蒸煮双商皆无",
  "粉丝环境太差了",
  "别整救赎文学了行吗",
  "这一天天的没完没了",
  "消费者都有脑子",
  "0人对不起你",
  "谁给的自信",
  "粉随蒸煮爱演",
  "残躯是什么",
  "托托也是人",
  "漏出创可贴纱布的结果来了",
  "爱自己这一块做不到",
  "还是你，cst",
  "源头就在你这",
  "管理下场本人发言",
  "你的操作我佩服",
  "这波操作源头就是你",
  "爱不了自己就别谈恋爱",
  "你的好样cst",
  "全票打飞这个狼人",
  "我是🤡扇自己两巴掌",
  "原来消失两天想出这出",
  "辜负真心的人吞针",
  "组里猜想全是真的",
  "原来你才是源头",
  "cst你好样的",
  "纱布的局布得真大",
  "早说啊直接祝福99",
  "老托快跑吧"
];

    const colors = ['#00f6ff','#00d9ff','#ff176f','#ff2d8b','#8b4dff','#b56cff','#b7ff00'];
    const W = () => window.innerWidth;
    const H = () => window.innerHeight;
    const pick = arr => arr[Math.floor(Math.random() * arr.length)];

    // =========================================================
    // 2. 文案池管理
    // =========================================================
    let availableQuotes = [...quotePool];

    function getRandomQuote() {
      if (availableQuotes.length === 0) {
        availableQuotes = [...quotePool];
      }
      const idx = Math.floor(Math.random() * availableQuotes.length);
      return availableQuotes.splice(idx, 1)[0];
    }

    function returnQuote(text) {
      if (text && !availableQuotes.includes(text)) {
        availableQuotes.push(text);
        console.log('📦 文案回池:', text, '池子现有:', availableQuotes.length);
      }
    }

    // =========================================================
    // 3. 灯牌队列
    // =========================================================
    let particles = [];

    // =========================================================
    // 4. 核心参数（硬编码，不猜）
    // =========================================================
    const SPEED = 100;           // 像素/秒
    const TRIGGER_RATIO = 0.15;  // 屏幕1/3处触发
    const START_Y = 0;          // 所有灯牌从顶部开始

    // =========================================================
    // 5. 创建灯牌（只做一件事：创建一个灯牌从Y=0开始）
    // =========================================================
    function createParticle() {
      const text = getRandomQuote();
      const el = document.createElement('div');
      el.className = 'falling-text' + (Math.random() > 0.5 ? ' flicker' : '');
      el.textContent = text;
      const color = pick(colors);
      el.style.color = color;
      el.style.setProperty('--base-opacity', (0.6 + Math.random() * 0.3).toFixed(2));

      el.style.position = 'fixed';
      el.style.top = '0px';
      el.style.left = '0px';
      el.style.opacity = '0';
      document.body.appendChild(el);

      // 测量宽度，设置水平位置
      const rect = el.getBoundingClientRect();
      const margin = Math.max(20, W() * 0.05);
      const width = rect.width || 200;
      const maxX = Math.max(margin + 20, W() - width - margin);
      const x = margin + Math.random() * Math.max(1, maxX - margin);
      const scale = 0.85 + Math.random() * 0.25;
      const rotate = -2 + Math.random() * 4;

      el.style.left = x + 'px';
      el.style.opacity = '1';
      el.offsetHeight;

      const particle = {
        el: el,
        quote: text,
        y: START_Y,
        scale: scale,
        rotate: rotate,
        hover: false
      };

      el.addEventListener('mouseenter', () => { particle.hover = true; });
      el.addEventListener('mouseleave', () => { particle.hover = false; });

      particles.push(particle);
      console.log('🌟 【出生】', text, '| 屏幕数量 =', particles.length);

      return particle;
    }

    // =========================================================
    // 6. 删除灯牌（只做一件事：删除，文案回池）
    // =========================================================
    function removeParticle(p) {
      console.log('💀 【离开】', p.quote, '| 离开前数量 =', particles.length);

      returnQuote(p.quote);

      if (p.el.parentNode) {
        p.el.parentNode.removeChild(p.el);
      }

      const idx = particles.indexOf(p);
      if (idx !== -1) {
        particles.splice(idx, 1);
      }

      console.log('  离开后数量 =', particles.length);
    }

    // =========================================================
    // 7. 初始化：只创建一个灯牌 A
    // =========================================================
    console.log('=== 初始化开始 ===');
    createParticle();
    console.log('=== 初始化完成，等待 A 到 1/3 ===');

    // =========================================================
    // 8. 动画循环
    // =========================================================
    let lastTime = performance.now();

    function animate(now) {
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      const screenHeight = H();
      const triggerY = screenHeight * TRIGGER_RATIO;

      // ---- 第一步：所有灯牌移动 ----
      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!p || !p.el) continue;

        if (!p.hover) {
          p.y += SPEED * delta;
        }

        p.el.style.transform =
          `translate3d(0, ${p.y}px, 0) scale(${p.scale}) rotate(${p.rotate}deg)`;
      }

      // ---- 第二步：检查最后一个灯牌是否到1/3 ----
      // ★★★ 这是唯一的出生规则 ★★★
      const newest = particles[particles.length - 1];
      if (newest && newest.y >= triggerY) {
        console.log('🔔 触发: 最新灯牌到 1/3，生成下一个');
        createParticle();
      }

      // ---- 第三步：检查是否有灯牌出底部 ----
      // ★★★ 这是唯一的死亡规则 ★★★
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (p && p.y >= screenHeight) {
          removeParticle(p);
        }
      }

      // ---- 第四步：每帧输出状态（可选，方便调试） ----
      // 每秒只输出一次，避免刷屏
      if (!window._lastLogTime || now - window._lastLogTime > 1000) {
        window._lastLogTime = now;
        // console.log('📊 当前灯牌数量:', particles.length);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

    // =========================================================
    // 9. 窗口调整
    // =========================================================
    window.addEventListener('resize', () => {
      const width = W();
      particles.forEach(p => {
        if (!p.el) return;
        const rect = p.el.getBoundingClientRect();
        const margin = Math.max(20, width * 0.05);
        const maxX = Math.max(margin + 20, width - rect.width - margin);
        let x = parseFloat(p.el.style.left);
        if (!Number.isFinite(x) || x < margin || x > maxX) {
          x = margin + Math.random() * Math.max(1, maxX - margin);
          p.el.style.left = x + 'px';
        }
      });
    });

  })();
</script>
</body>
</html>
