<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>来日方长 · 珍而重之</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168bd1;
    --blue-dark: #0874b8;
    --blue-light: #63c4ed;
    --sky: #dff4ff;
    --cream: #fffdf5;
    --yellow: #ffd84d;
    --red: #e84d4d;
    --ink: #27465b;
    --muted: #7893a4;
    --line: #d9edf7;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: var(--ink);

    background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.95) 0 55px, transparent 56px),
        radial-gradient(circle at 85% 18%, rgba(255,255,255,.8) 0 75px, transparent 76px),
        linear-gradient(
            180deg,
            #8fd8f5 0%,
            #c7edfb 34%,
            #eaf8fc 68%,
            #fffdf7 100%
        );

    overflow-x: hidden;
}

/* =========================================================
   背景云朵
   ========================================================= */

.cloud {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: .48;
    filter: blur(.2px);
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,.92);
    border-radius: 999px;
}

.cloud.one {
    width: 180px;
    height: 48px;
    top: 95px;
    left: -40px;
}

.cloud.one::before {
    width: 75px;
    height: 75px;
    left: 35px;
    bottom: 0;
}

.cloud.one::after {
    width: 100px;
    height: 90px;
    left: 80px;
    bottom: 0;
}

.cloud.two {
    width: 220px;
    height: 55px;
    top: 210px;
    right: -80px;
    opacity: .3;
}

.cloud.two::before {
    width: 85px;
    height: 85px;
    left: 40px;
    bottom: 0;
}

.cloud.two::after {
    width: 110px;
    height: 100px;
    left: 100px;
    bottom: 0;
}

/* =========================================================
   漂浮星星
   ========================================================= */

.star {
    position: fixed;
    color: rgba(255,255,255,.75);
    pointer-events: none;
    z-index: 0;
    animation: twinkle 3s ease-in-out infinite;
}

.star.s1 {
    top: 120px;
    right: 17%;
    font-size: 18px;
}

.star.s2 {
    top: 340px;
    left: 7%;
    font-size: 13px;
    animation-delay: 1s;
}

.star.s3 {
    top: 480px;
    right: 8%;
    font-size: 15px;
    animation-delay: 1.8s;
}

@keyframes twinkle {
    0%,100% {
        opacity: .25;
        transform: scale(.85);
    }

    50% {
        opacity: .9;
        transform: scale(1.15);
    }
}

/* =========================================================
   主容器
   ========================================================= */

.container {
    width: min(900px, calc(100% - 32px));
    margin: 0 auto;
    padding: 58px 0 45px;
    position: relative;
    z-index: 2;
}

/* =========================================================
   顶部
   ========================================================= */

.header {
    position: relative;
    background: linear-gradient(
        145deg,
        #1596dc 0%,
        #168bd1 55%,
        #0874b8 100%
    );

    border-radius: 34px;
    padding: 34px 30px 31px;

    box-shadow:
        0 18px 45px rgba(23,120,170,.22),
        inset 0 2px 0 rgba(255,255,255,.25),
        inset 0 -5px 0 rgba(4,92,145,.3);

    border: 3px solid rgba(255,255,255,.92);

    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    right: -90px;
    top: -130px;

    border-radius: 50%;

    background: rgba(255,255,255,.1);
}

.header::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    left: -80px;
    bottom: -100px;

    border-radius: 50%;

    background: rgba(255,255,255,.08);
}

/* 铃铛 */

.bell {
    position: absolute;
    left: 28px;
    top: 25px;

    width: 32px;
    height: 32px;

    background: var(--yellow);
    border-radius: 50% 50% 45% 45%;

    border: 3px solid #f1bd21;

    box-shadow:
        inset 0 -5px 0 rgba(190,135,0,.18),
        0 3px 7px rgba(0,0,0,.12);

    z-index: 3;
}

.bell::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    left: 10px;
    bottom: 4px;

    background: #bd8a0c;
    border-radius: 50%;
}

.bell::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 4px;
    left: 3px;
    bottom: 8px;

    background: #e8b51c;
    border-radius: 5px;
}

/*  */

.pocket {
    position: absolute;
    right: 29px;
    bottom: -30px;

    width: 120px;
    height: 82px;

    border-radius: 65px 65px 0 0;

    background: #eaf9ff;
    border: 5px solid #d7f1fb;

    opacity: .22;
}

.header-content {
    position: relative;
    z-index: 3;
    text-align: center;
}

.header h1 {
    color: white;

    font-size: clamp(25px, 5vw, 34px);
    line-height: 1.35;

    font-weight: 800;
    letter-spacing: 3px;

    text-shadow:
        0 3px 0 rgba(5,92,145,.55),
        0 7px 18px rgba(0,0,0,.08);
}

.header-sub {
    margin-top: 10px;

    color: rgba(255,255,255,.88);

    font-size: 13px;
    letter-spacing: 2px;
}

.header-sub strong {
    color: var(--yellow);
    font-size: 21px;

    text-shadow:
        0 2px 0 rgba(0,0,0,.16);
}

/* =========================================================
   小标题
   ========================================================= */

.archive-label {
    display: flex;
    align-items: center;
    gap: 12px;

    margin: 34px 4px 15px;

    color: #5b8296;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 2px;
}

.archive-label::before {
    content: "";
    width: 9px;
    height: 9px;

    background: var(--yellow);
    border-radius: 50%;

    border: 2px solid #e8bb24;

    box-shadow: 0 0 0 4px rgba(255,216,77,.18);
}

.archive-label::after {
    content: "";
    height: 1px;
    flex: 1;

    background: linear-gradient(
        90deg,
        #c8e8f4,
        transparent
    );
}

/* =========================================================
   帖子列表
   ========================================================= */

.post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.post-item {
    position: relative;

    display: block;

    padding: 22px 24px 20px 27px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.97),
            rgba(255,253,247,.95)
        );

    border: 1px solid rgba(174,216,234,.75);
    border-radius: 18px;

    text-decoration: none;
    color: inherit;

    box-shadow:
        0 5px 20px rgba(43,128,164,.07),
        0 1px 0 rgba(255,255,255,.9) inset;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.post-item::before {
    content: "";

    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;

    width: 4px;

    border-radius: 0 4px 4px 0;

    background: linear-gradient(
        180deg,
        var(--blue-light),
        var(--blue)
    );
}

.post-item:hover {
    transform: translateY(-3px);

    border-color: #8bd1ee;

    box-shadow:
        0 12px 32px rgba(43,128,164,.13),
        0 0 0 4px rgba(79,190,230,.06);
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 18px;
}

.title {
    color: #294b60;

    font-size: 17px;
    font-weight: 750;

    line-height: 1.55;

    transition: color .2s ease;
}

.post-item:hover .title {
    color: var(--blue-dark);
}

.date {
    display: inline-block;

    margin-top: 10px;

    padding: 3px 9px;

    border-radius: 20px;

    background: #eef9fd;
    border: 1px solid #d6eef7;

    color: #70a0b5;

    font-size: 10px;
    font-weight: 600;

    white-space: nowrap;
}

.desc {
    margin-top: 9px;

    padding-left: 2px;

    color: #86a0ad;

    font-size: 13px;
    line-height: 1.65;
}

/* =========================================================
   底部
   ========================================================= */

.footer {
    margin-top: 38px;

    text-align: center;

    color: #8ca8b5;

    font-size: 11px;
    letter-spacing: 1.5px;
}

.footer::before {
    content: "✦";

    display: block;

    margin-bottom: 9px;

    color: #f2c62e;
    font-size: 14px;
}

/* =========================================================
   手机端
   ========================================================= */

@media (max-width: 640px) {

    .container {
        width: calc(100% - 20px);
        padding-top: 25px;
    }

    .header {
        padding: 27px 18px 25px;
        border-radius: 25px;
    }

    .header h1 {
        font-size: 23px;
        letter-spacing: 2px;
    }

    .header-sub {
        font-size: 11px;
        letter-spacing: 1px;
    }

    .bell {
        left: 17px;
        top: 18px;
        transform: scale(.8);
    }

    .pocket {
        right: -15px;
    }

    .archive-label {
        margin-top: 27px;
    }

    .post-item {
        padding: 19px 17px 17px 21px;
        border-radius: 15px;
    }

    .row {
        flex-direction: column;
        gap: 8px;
    }

    .title {
        font-size: 15px;
        line-height: 1.55;
    }

    .date {
        font-size: 10px;
    }

    .desc {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<div class="cloud one"></div>
<div class="cloud two"></div>

<div class="star s1">✦</div>
<div class="star s2">✦</div>
<div class="star s3">✦</div>

<div class="container">

    <header class="header">

        <div class="bell"></div>
        <div class="pocket"></div>

        <div class="header-content">

            <h1>来日方长 · 珍而重之</h1>

            <div class="header-sub">
                共
                <strong id="postCount">0</strong>
                篇 · 持续更新
            </div>

        </div>

    </header>

    <div class="archive-label">
        MEMORY ARCHIVE
    </div>

    <main class="post-list" id="postList"></main>

    <footer class="footer">
        仅供个人存档 · 不定期更新
    </footer>

</div>

<script>

const postsData = [
{
                title: "我只想说明真相，也不带任何rrgj。该给的体面已经给了。不明真相的请看此楼。",
                link: "我只想说明真相，也不带任何rrgj。该给的体面已经给了。不明真相的请看此楼。/1.html",
                date: "2026-08-08 16:27:52",
                desc: "已备份😎，休想春秋笔法"
            },
            {
                title: "开一个两个人互送礼物的记录楼吧（更新至260717）",
                link: "开一个两个人互送礼物的记录楼吧（更新至260717）/1.html",
                date: "2026-08-02 22:28:13",
                desc: "已备份😎，休想春秋笔法"
            },
    {
        title: "婆婆子cyberpunk",
        link: "婆婆子cyberpunk/1.html",
        date: "9999-99-99 99:99:99",
        desc: "胡言乱语发疯中"
    },
                                        {
                title: "又咯噔上了姐妹",
                link: "又咯噔上了姐妹/1.html",
                date: "2026-08-21 21:58:03",
                desc: "已备份😎，休想春秋笔法"
            },
                {
                title: "想跟xxx说",
                link: "想跟xxx说/1.html",
                date: "2026-08-21 07:58:24",
                desc: "已备份😎，休想春秋笔法"
            },
    {
        title: "时间线",
        link: "时间线原版/时间线.html",
        date: "2026-08-03 14:00:44",
        desc: "被下架后恢复的5页长帖，共443条评论"
    }
        ];

function render() {

    const list = document.getElementById("postList");

    const sorted = [...postsData].sort(
        (a, b) =>
            new Date(b.date) -
            new Date(a.date)
    );

    list.innerHTML = sorted.map(p => `
        <a class="post-item" href="${p.link}">

            <div class="title">
                ${p.title}
            </div>

            ${
                p.desc
                ? `<div class="desc">${p.desc}</div>`
                : ""
            }

            <div class="date">
                最后更新 · ${p.date}
            </div>

        </a>
    `).join("");

    document.getElementById("postCount").textContent =
        postsData.length;
}

render();

</script>

</body>
</html>
