<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔵 帖子存档 · 哆啦A梦</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
            background: #f0f8ff;
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, #87CEEB 0%, #B0E0E6 50%, #f0f8ff 100%);
            z-index: -2;
        }

        .cloud {
            position: fixed;
            font-size: 55px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            animation: cloudFloat 25s ease-in-out infinite alternate;
        }
        .cloud:nth-child(1) { top: 30px; left: -40px; animation-duration: 30s; }
        .cloud:nth-child(2) { top: 90px; right: -30px; animation-duration: 35s; animation-direction: reverse; }
        .cloud:nth-child(3) { top: 160px; left: 20%; animation-duration: 28s; opacity: 0.2; }
        @keyframes cloudFloat {
            0% { transform: translateX(0); }
            100% { transform: translateX(80px); }
        }

        .doraemon-big {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 90px;
            z-index: 0;
            opacity: 0.12;
            pointer-events: none;
            animation: doraemonFloat 4s ease-in-out infinite;
        }
        @keyframes doraemonFloat {
            0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
            50% { transform: translateX(-50%) translateY(-15px) rotate(-3deg); }
        }

        .helicopter {
            position: fixed;
            top: 60px;
            left: 20px;
            font-size: 45px;
            z-index: 0;
            opacity: 0.2;
            pointer-events: none;
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .door {
            position: fixed;
            bottom: 40px;
            right: 20px;
            font-size: 70px;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            animation: doorShake 5s ease-in-out infinite;
        }
        @keyframes doorShake {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); }
        }

        .dorayaki {
            position: fixed;
            top: 50%;
            right: 10px;
            font-size: 35px;
            z-index: 0;
            opacity: 0.1;
            pointer-events: none;
            animation: dorayakiBounce 3s ease-in-out infinite;
        }
        @keyframes dorayakiBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(8deg); }
        }

        .bell {
            position: fixed;
            top: 40px;
            right: 30px;
            font-size: 35px;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            animation: bellRing 2s ease-in-out infinite;
        }
        @keyframes bellRing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-20deg); }
            75% { transform: rotate(20deg); }
        }

        .doraemon-small {
            position: fixed;
            top: 120px;
            right: 10px;
            font-size: 30px;
            z-index: 0;
            opacity: 0.08;
            pointer-events: none;
            animation: doraemonFloat 3s ease-in-out infinite;
        }

        .container {
            max-width: 860px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, #1a8cff 0%, #2196F3 50%, #1a8cff 100%);
            padding: 26px 24px 20px;
            border-radius: 30px 30px 30px 4px;
            box-shadow: 0 8px 30px rgba(26, 140, 255, 0.2), inset 0 -4px 0 #0d6eb8;
            margin-bottom: 34px;
            text-align: center;
            position: relative;
            border: 3px solid #ffffff;
        }
        .header::before {
            content: '🔔';
            position: absolute;
            top: -18px;
            left: 20px;
            font-size: 30px;
            animation: bellRing 2s ease-in-out infinite;
        }
        .header::after {
            content: '🔔';
            position: absolute;
            top: -18px;
            right: 20px;
            font-size: 30px;
            animation: bellRing 2s ease-in-out infinite reverse;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 3px 3px 0 #0d6eb8, 0 0 30px rgba(255,255,255,0.1);
            letter-spacing: 2px;
            line-height: 1.4;
        }
        .header .sub {
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            margin-top: 6px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .header .sub span {
            font-weight: 800;
            font-size: 18px;
            color: #FFD700;
            text-shadow: 2px 2px 0 #0d6eb8;
        }

        .post-list { display: flex; flex-direction: column; gap: 16px; }

        .post-item {
            display: block;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 24px 26px 20px;
            border-radius: 20px 20px 20px 4px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 20px rgba(26, 140, 255, 0.06), inset 0 1px 0 rgba(255,255,255,0.8);
            text-decoration: none;
            color: inherit;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }
        .post-item::before {
            content: '🔵';
            position: absolute;
            top: -10px;
            left: -6px;
            font-size: 20px;
            opacity: 0.2;
        }

        .post-item:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 12px 40px rgba(26, 140, 255, 0.12), 0 0 40px rgba(26, 140, 255, 0.04);
            background: rgba(255, 255, 255, 0.95);
        }

        .post-item .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }
        .post-item .title {
            font-size: 18px;
            font-weight: 700;
            color: #1a2a3a;
            transition: color 0.3s ease;
            line-height: 1.5;
        }
        .post-item:hover .title {
            color: #1a8cff;
        }

        /* ===== 标签样式日期 ===== */
        .post-item .date {
            font-size: 12px;
            font-weight: 600;
            color: #1a8cff;
            background: rgba(26, 140, 255, 0.08);
            padding: 4px 16px;
            border-radius: 30px;
            white-space: nowrap;
            flex-shrink: 0;
            border: 1px solid rgba(26, 140, 255, 0.08);
        }
        .post-item .date::before {
            content: '📅 ';
            font-size: 12px;
        }

        .post-item .desc {
            font-size: 14px;
            color: #5a7a8a;
            margin-top: 4px;
            line-height: 1.7;
            padding-left: 4px;
            font-weight: 400;
            border-left: 3px solid #1a8cff;
            padding-left: 14px;
            opacity: 0.7;
        }

        .footer {
            margin-top: 48px;
            padding: 16px 0 10px;
            border-top: 3px dashed rgba(26, 140, 255, 0.15);
            font-size: 13px;
            color: #8ab0c0;
            text-align: center;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .footer span {
            color: #1a8cff;
            font-weight: 700;
        }

        @media (max-width: 640px) {
            body { padding: 16px 10px; }
            .header { padding: 18px 14px 14px; border-radius: 24px; }
            .header h1 { font-size: 20px; }
            .header .sub { font-size: 12px; }
            .header .sub span { font-size: 15px; }
            .header::before, .header::after { font-size: 22px; top: -14px; left: 10px; right: 10px; }
            .post-item { padding: 18px 16px 16px; border-radius: 16px; }
            .post-item .row { flex-direction: column; align-items: flex-start; gap: 6px; margin-bottom: 8px; }
            .post-item .title { font-size: 15px; }
            .post-item .date { font-size: 10px; padding: 3px 12px; }
            .post-item .date::before { font-size: 10px; }
            .post-item .desc { font-size: 13px; padding-left: 10px; }
            .post-item::before { font-size: 14px; top: -6px; left: -4px; }
            .cloud { font-size: 30px; }
            .doraemon-big { font-size: 60px; bottom: 10px; opacity: 0.08; }
            .helicopter { font-size: 30px; top: 30px; left: 10px; opacity: 0.15; }
            .door { font-size: 45px; bottom: 20px; right: 10px; opacity: 0.1; }
            .dorayaki { font-size: 25px; top: 40%; right: 5px; opacity: 0.08; }
            .bell { font-size: 25px; top: 25px; right: 15px; opacity: 0.1; }
            .doraemon-small { font-size: 20px; top: 80px; right: 5px; opacity: 0.06; }
            .footer { font-size: 11px; }
        }

        @media (prefers-color-scheme: dark) {
            body { background: #0a1a2a; }
            body::before {
                background: linear-gradient(180deg, #0a2a4a 0%, #0a1a2a 60%, #060e16 100%);
            }
            .header {
                background: linear-gradient(135deg, #0d6eb8 0%, #1a8cff 50%, #0d6eb8 100%);
                box-shadow: 0 8px 30px rgba(26, 140, 255, 0.08);
            }
            .header h1 { color: #ffffff; text-shadow: 3px 3px 0 #0a4a7a; }
            .header .sub { color: rgba(255,255,255,0.7); }
            .post-item {
                background: rgba(10, 30, 50, 0.7);
                backdrop-filter: blur(8px);
                border-color: rgba(26, 140, 255, 0.1);
            }
            .post-item:hover {
                background: rgba(10, 30, 50, 0.9);
                box-shadow: 0 12px 40px rgba(26, 140, 255, 0.06);
            }
            .post-item .title { color: #d0e8f0; }
            .post-item:hover .title { color: #4aafff; }
            .post-item .date {
                color: #4aafff;
                background: rgba(26, 140, 255, 0.06);
                border-color: rgba(26, 140, 255, 0.06);
            }
            .post-item .desc { color: #6a8a9a; border-left-color: #1a8cff; }
            .footer { border-top-color: rgba(26, 140, 255, 0.06); color: #3a5a6a; }
            .footer span { color: #1a8cff; }
            .cloud { opacity: 0.12; }
            .doraemon-big { opacity: 0.05; }
            .helicopter { opacity: 0.08; }
            .door { opacity: 0.06; }
            .dorayaki { opacity: 0.05; }
            .bell { opacity: 0.06; }
            .doraemon-small { opacity: 0.04; }
        }
    </style>
</head>
<body>

    <div class="cloud">☁️☁️☁️</div>
    <div class="cloud">☁️☁️</div>
    <div class="cloud">☁️</div>

    <div class="doraemon-big">🐱</div>
    <div class="helicopter">🚁</div>
    <div class="door">🚪</div>
    <div class="dorayaki">🍩</div>
    <div class="bell">🔔</div>
    <div class="doraemon-small">🐱</div>

    <div class="container">
        <div class="header">
            <h1>来日方长 珍而重之</h1>
            <div class="sub">共 <span id="postCount">0</span> 篇 · 持续更新</div>
        </div>
        <div class="post-list" id="postList"></div>
        <div class="footer"><span>◆</span> 仅供个人存档 · 不定期更新 <span>◆</span></div>
    </div>

    <script>
        const postsData = [
            {
                title: "开一个两个人互送礼物的记录楼吧（更新至260717）",
                link: "开一个两个人互送礼物的记录楼吧（更新至260717）/1.html",
                date: "2026-08-21",
                desc: "持续更新的礼物记录帖"
            },
            {
                title: "又咯噔上了姐妹",
                link: "又咯噔上了姐妹/1.html",
                date: "2026-08-21",
                desc: "婆子们闹麻了"
            },
            {
                title: "想跟xxx说",
                link: "想跟xxx说/1.html",
                date: "2026-08-19",
                desc: "一段关于告别与成长的故事"
            },
            {
                title: "时间线",
                link: "时间线原版/时间线.html",
                date: "2026-08-03",
                desc: "被下架后恢复的5页长帖，共443条评论"
            }
        ];

        function render() {
            const list = document.getElementById('postList');
            const sorted = [...postsData].sort((a, b) => new Date(b.date) - new Date(a.date));
            list.innerHTML = sorted.map(p => `
                <a class="post-item" href="${p.link}">
                    <div class="row">
                        <span class="title">${p.title}</span>
                        <span class="date">最后更新：${p.date}</span>
                    </div>
                    ${p.desc ? `<div class="desc">${p.desc}</div>` : ''}
                </a>
            `).join('');
            document.getElementById('postCount').textContent = postsData.length;
        }

        render();
    </script>
</body>
</html>
