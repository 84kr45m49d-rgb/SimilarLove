<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>来日方长 · 珍而重之</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --blue: #168bd1;
    --blue-dark: #0874b8;
    --blue-light: #63c4ed;
    --sky: #dff4ff;
    --cream: #fffdf5;
    --yellow: #ffd84d;
    --red: #e84d4d;
    --ink: #27465b;
    --muted: #7893a4;
    --line: #d9edf7;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    color: var(--ink);

    background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.95) 0 55px, transparent 56px),
        radial-gradient(circle at 85% 18%, rgba(255,255,255,.8) 0 75px, transparent 76px),
        linear-gradient(
            180deg,
            #8fd8f5 0%,
            #c7edfb 34%,
            #eaf8fc 68%,
            #fffdf7 100%
        );

    overflow-x: hidden;
}

/* =========================================================
   背景云朵
   ========================================================= */

.cloud {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    opacity: .48;
    filter: blur(.2px);
}

.cloud::before,
.cloud::after {
    content: "";
    position: absolute;
    background: rgba(255,255,255,.92);
    border-radius: 999px;
}

.cloud.one {
    width: 180px;
    height: 48px;
    top: 95px;
    left: -40px;
}

.cloud.one::before {
    width: 75px;
    height: 75px;
    left: 35px;
    bottom: 0;
}

.cloud.one::after {
    width: 100px;
    height: 90px;
    left: 80px;
    bottom: 0;
}

.cloud.two {
    width: 220px;
    height: 55px;
    top: 210px;
    right: -80px;
    opacity: .3;
}

.cloud.two::before {
    width: 85px;
    height: 85px;
    left: 40px;
    bottom: 0;
}

.cloud.two::after {
    width: 110px;
    height: 100px;
    left: 100px;
    bottom: 0;
}

/* =========================================================
   漂浮星星
   ========================================================= */

.star {
    position: fixed;
    color: rgba(255,255,255,.75);
    pointer-events: none;
    z-index: 0;
    animation: twinkle 3s ease-in-out infinite;
}

.star.s1 {
    top: 120px;
    right: 17%;
    font-size: 18px;
}

.star.s2 {
    top: 340px;
    left: 7%;
    font-size: 13px;
    animation-delay: 1s;
}

.star.s3 {
    top: 480px;
    right: 8%;
    font-size: 15px;
    animation-delay: 1.8s;
}

@keyframes twinkle {
    0%,100% {
        opacity: .25;
        transform: scale(.85);
    }

    50% {
        opacity: .9;
        transform: scale(1.15);
    }
}

/* =========================================================
   主容器
   ========================================================= */

.container {
    width: min(900px, calc(100% - 32px));
    margin: 0 auto;
    padding: 58px 0 45px;
    position: relative;
    z-index: 2;
}

/* =========================================================
   顶部
   ========================================================= */

.header {
    position: relative;
    background: linear-gradient(
        145deg,
        #1596dc 0%,
        #168bd1 55%,
        #0874b8 100%
    );

    border-radius: 34px;
    padding: 34px 30px 31px;

    box-shadow:
        0 18px 45px rgba(23,120,170,.22),
        inset 0 2px 0 rgba(255,255,255,.25),
        inset 0 -5px 0 rgba(4,92,145,.3);

    border: 3px solid rgba(255,255,255,.92);

    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    right: -90px;
    top: -130px;

    border-radius: 50%;

    background: rgba(255,255,255,.1);
}

.header::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    left: -80px;
    bottom: -100px;

    border-radius: 50%;

    background: rgba(255,255,255,.08);
}

/* 铃铛 */

.bell {
    position: absolute;
    left: 28px;
    top: 25px;

    width: 32px;
    height: 32px;

    background: var(--yellow);
    border-radius: 50% 50% 45% 45%;

    border: 3px solid #f1bd21;

    box-shadow:
        inset 0 -5px 0 rgba(190,135,0,.18),
        0 3px 7px rgba(0,0,0,.12);

    z-index: 3;
}

.bell::before {
    content: "";
    position: absolute;
    width: 7px;
    height: 7px;
    left: 10px;
    bottom: 4px;

    background: #bd8a0c;
    border-radius: 50%;
}

.bell::after {
    content: "";
    position: absolute;
    width: 20px;
    height: 4px;
    left: 3px;
    bottom: 8px;

    background: #e8b51c;
    border-radius: 5px;
}

.pocket {
    position: absolute;
    right: 29px;
    bottom: -30px;

    width: 120px;
    height: 82px;

    border-radius: 65px 65px 0 0;

    background: #eaf9ff;
    border: 5px solid #d7f1fb;

    opacity: .22;
}

.header-content {
    position: relative;
    z-index: 3;
    text-align: center;
}

.header h1 {
    color: white;

    font-size: clamp(25px, 5vw, 34px);
    line-height: 1.35;

    font-weight: 800;
    letter-spacing: 3px;

    text-shadow:
        0 3px 0 rgba(5,92,145,.55),
        0 7px 18px rgba(0,0,0,.08);
}

.header-sub {
    margin-top: 10px;

    color: rgba(255,255,255,.88);

    font-size: 13px;
    letter-spacing: 2px;
}

.header-sub strong {
    color: var(--yellow);
    font-size: 21px;

    text-shadow:
        0 2px 0 rgba(0,0,0,.16);
}

/* =========================================================
   小标题
   ========================================================= */

.archive-label {
    display: flex;
    align-items: center;
    gap: 12px;

    margin: 34px 4px 15px;

    color: #5b8296;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 2px;
}

.archive-label::before {
    content: "";
    width: 9px;
    height: 9px;

    background: var(--yellow);
    border-radius: 50%;

    border: 2px solid #e8bb24;

    box-shadow: 0 0 0 4px rgba(255,216,77,.18);
}

.archive-label::after {
    content: "";
    height: 1px;
    flex: 1;

    background: linear-gradient(
        90deg,
        #c8e8f4,
        transparent
    );
}

/* =========================================================
   帖子列表
   ========================================================= */

.post-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.post-item {
    position: relative;

    display: block;

    min-height: 168px;

    padding: 30px 30px 27px 34px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.97),
            rgba(255,253,247,.95)
        );

    border: 1px solid rgba(174,216,234,.75);
    border-radius: 18px;

    text-decoration: none;
    color: inherit;

    box-shadow:
        0 5px 20px rgba(43,128,164,.07),
        0 1px 0 rgba(255,255,255,.9) inset;

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border-color .25s ease;
}

.post-item::before {
    content: "";

    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;

    width: 4px;

    border-radius: 0 4px 4px 0;

    background: linear-gradient(
        180deg,
        var(--blue-light),
        var(--blue)
    );
}

.post-item:hover {
    transform: translateY(-3px);

    border-color: #8bd1ee;

    box-shadow:
        0 12px 32px rgba(43,128,164,.13),
        0 0 0 4px rgba(79,190,230,.06);
}

.title {
    color: #294b60;

    font-size: 17px;
    font-weight: 750;

    line-height: 1.7;

    transition: color .2s ease;
}



/* =========================================================
   婆婆子 · FINAL REAL NEON SIGN
   红色霓虹框 + 暖白霓虹文字
   ========================================================= */

.post-item.bopo-card{

    position:relative;

    min-height:150px !important;

    margin-bottom:30px;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:32px 28px;

    overflow:hidden;

    /*
       黑色玻璃底
    */

    background:

        radial-gradient(
            ellipse at center,
            rgba(255,45,25,.12),
            transparent 62%
        ),

        radial-gradient(
            ellipse at 50% 100%,
            rgba(120, 20, 30, .16),
            transparent 70%
        ),

        linear-gradient(
            180deg,
            rgba(255,255,255,.055),
            rgba(70,15,24,.10) 55%,
            rgba(12,3,8,.25) 100%
        ),

        rgba(18, 7, 12, .90) !important;

    /*
       第一层：真正的红色霓虹管
    */

    border:2px solid #ff3030 !important;

    /*
       红色灯管 + 红色环境光
    */

    box-shadow:

        0 0 3px #ff3030,

        0 0 7px #ff3030,

        0 0 15px rgba(255,45,45,.95),

        0 0 30px rgba(255,35,35,.65),

        0 0 58px rgba(255,25,25,.32),

        inset 0 0 8px rgba(255,45,45,.16),

        inset 0 0 25px rgba(255,45,45,.07);

    transition:
        transform .2s ease,
        filter .2s ease,
        box-shadow .2s ease;

    animation:
        bopoNeonCurrent 6s ease-in-out infinite;
}


/* =========================================================
   第二层红色霓虹外溢
   ========================================================= */

.post-item.bopo-card::before{

    content:"";

    position:absolute;

    inset:-5px;

    border:1px solid rgba(255,80,60,.58);

    box-shadow:

        0 0 5px rgba(255,50,40,.9),

        0 0 14px rgba(255,45,45,.65),

        0 0 30px rgba(255,35,35,.35);

    pointer-events:none;

    opacity:.78;
}


/* =========================================================
   顶部玻璃反光
   ========================================================= */

.post-item.bopo-card::after{

    content:"";

    position:absolute;

    left:10%;

    right:10%;

    top:8px;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,220,205,.35),
            rgba(255,255,255,.75),
            rgba(255,220,205,.35),
            transparent
        );

    box-shadow:
        0 0 6px rgba(255,180,150,.4);

    opacity:.55;

    pointer-events:none;
}


/* =========================================================
   婆婆子文字
   ========================================================= */

.post-item.bopo-card .bopo-text{

    position:relative;

    z-index:5;

    color:#fff8e9 !important;

    font-family:
        'Noto Sans SC',
        'PingFang SC',
        'Microsoft YaHei',
        sans-serif;

    font-size:
        clamp(25px,5vw,36px);

    font-weight:900;

    letter-spacing:
        clamp(4px,1vw,8px);

    line-height:1.3;

    text-align:center;

    white-space:nowrap;

    /*
       重点：
       字芯白
       第一圈也是白
       后面才出现非常淡的橙色
    */

    text-shadow:

        0 0 1px #ffffff,

        0 0 3px #ffffff,

        0 0 6px rgba(255,255,250,1),

        0 0 11px rgba(255,248,225,.95),

        0 0 18px rgba(255,220,170,.75),

        0 0 30px rgba(255,170,90,.48),

        0 0 48px rgba(255,120,45,.24) !important;

    -webkit-text-stroke:
        .3px rgba(255,255,255,.65);

    animation:
        bopoTextGlow 4.5s ease-in-out infinite;
}


/* =========================================================
   文字两侧小灯管
   ========================================================= */

.post-item.bopo-card .bopo-text::before,
.post-item.bopo-card .bopo-text::after{

    content:"";

    position:absolute;

    top:50%;

    width:30px;

    height:2px;

    background:#ff3434;

    box-shadow:

        0 0 4px #ff3434,

        0 0 9px #ff3434,

        0 0 18px rgba(255,45,45,.8);

    transform:translateY(-50%);

    opacity:.9;
}

.post-item.bopo-card .bopo-text::before{
    right:100%;
    margin-right:18px;
}

.post-item.bopo-card .bopo-text::after{
    left:100%;
    margin-left:18px;
}


/* =========================================================
   文字正常通电呼吸
   ========================================================= */

@keyframes bopoTextGlow{

    0%,100%{

        opacity:.96;

        text-shadow:

            0 0 1px #fff,

            0 0 3px #fff,

            0 0 6px rgba(255,255,250,1),

            0 0 11px rgba(255,248,225,.92),

            0 0 18px rgba(255,220,170,.68),

            0 0 30px rgba(255,170,90,.42),

            0 0 48px rgba(255,120,45,.20);
    }

    48%{
        opacity:1;
    }

    50%{

        opacity:1.08;

        text-shadow:

            0 0 1px #fff,

            0 0 4px #fff,

            0 0 8px #fffef5,

            0 0 14px #fff5dc,

            0 0 22px rgba(255,225,180,.9),

            0 0 38px rgba(255,175,100,.58),

            0 0 58px rgba(255,120,50,.28);
    }

    53%{
        opacity:.96;
    }
}


/* =========================================================
   红色灯框轻微电流波动
   ========================================================= */

@keyframes bopoNeonCurrent{

    0%,100%{

        filter:brightness(.96);

        box-shadow:

            0 0 3px #ff3030,

            0 0 7px #ff3030,

            0 0 15px rgba(255,45,45,.95),

            0 0 30px rgba(255,35,35,.65),

            0 0 58px rgba(255,25,25,.32),

            inset 0 0 8px rgba(255,45,45,.16),

            inset 0 0 25px rgba(255,45,45,.07);
    }

    47%{
        filter:brightness(1);
    }

    49%{

        filter:brightness(1.12);

        box-shadow:

            0 0 4px #ff3838,

            0 0 10px #ff3838,

            0 0 20px rgba(255,55,45,1),

            0 0 40px rgba(255,40,35,.78),

            0 0 72px rgba(255,25,25,.40),

            inset 0 0 11px rgba(255,55,45,.22),

            inset 0 0 30px rgba(255,45,45,.09);
    }

    51%{
        filter:brightness(.93);
    }

    53%{
        filter:brightness(1.04);
    }

    55%{
        filter:brightness(.98);
    }
}


/* =========================================================
   偶尔轻微接触不良
   ========================================================= */

@keyframes bopoTinyFlicker{

    0%,96%,100%{
        opacity:1;
    }

    97%{
        opacity:.82;
    }

    97.3%{
        opacity:1;
    }

    98%{
        opacity:.9;
    }

    98.2%{
        opacity:1;
    }
}

.post-item.bopo-card .bopo-text{
    animation:
        bopoTextGlow 4.5s ease-in-out infinite,
        bopoTinyFlicker 9s steps(1,end) infinite;
}


/* =========================================================
   鼠标悬停
   ========================================================= */

.post-item.bopo-card:hover{

    transform:scale(1.018);

    filter:brightness(1.1);

    box-shadow:

        0 0 4px #ff3030,

        0 0 10px #ff3030,

        0 0 20px rgba(255,45,45,1),

        0 0 40px rgba(255,35,35,.82),

        0 0 75px rgba(255,25,25,.48),

        0 0 110px rgba(255,20,20,.20),

        inset 0 0 12px rgba(255,45,45,.22),

        inset 0 0 35px rgba(255,45,45,.10);
}

.post-item.bopo-card:hover .bopo-text{

    text-shadow:

        0 0 1px #fff,

        0 0 4px #fff,

        0 0 8px #fff,

        0 0 14px #fff9e8,

        0 0 23px #ffe7bc,

        0 0 36px rgba(255,190,110,.85),

        0 0 58px rgba(255,130,50,.42) !important;
}


/* =========================================================
   手机端
   ========================================================= */

@media (max-width:700px){

    .post-item.bopo-card{

        min-height:125px !important;

        padding:
            25px 20px;
    }

    .post-item.bopo-card .bopo-text{

        font-size:
            clamp(21px,7vw,31px);

        letter-spacing:
            clamp(3px,1.2vw,7px);
    }

    .post-item.bopo-card .bopo-text::before,
    .post-item.bopo-card .bopo-text::after{

        width:18px;
    }

    .post-item.bopo-card .bopo-text::before{
        margin-right:10px;
    }

    .post-item.bopo-card .bopo-text::after{
        margin-left:10px;
    }
}



/* =========================================================
   FINAL FINAL OVERRIDE
   婆婆子 / 来日方长 / 普通帖子
   统一经典霓虹视觉
   Desktop + Mobile
   ========================================================= */


/* =========================================================
   ① 所有主要卡片：统一圆角
   ========================================================= */

.header,
.post-item,
.post-item.bopo-card,
.post-item.cyber-card{

    border-radius:16px !important;
}


/* =========================================================
   ② 婆婆子
   CLASSIC RED NEON SIGN
   深炭黑 + 樱桃红 + 暖白
   ========================================================= */

.post-item.bopo-card{

    /*
       明显加高
    */

    min-height:190px !important;

    height:auto !important;

    padding:
        42px 30px !important;

    margin-bottom:30px !important;

    /*
       经典霓虹招牌底色

       不纯黑
       不藏蓝
       不酒红

       是偏暖的深炭黑
    */

    background:

        radial-gradient(
            ellipse at 50% 50%,
            rgba(255,45,45,.075),
            transparent 62%
        ),

        linear-gradient(
            180deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,0) 32%
        ),

        #171416 !important;

    /*
       经典樱桃红灯框
    */

    border:
        2px solid #ff3038 !important;

    box-shadow:

        0 0 3px #ff3038,

        0 0 8px #ff3038,

        0 0 17px rgba(255,48,56,.88),

        0 0 34px rgba(255,42,48,.58),

        0 0 58px rgba(255,38,45,.30),

        inset 0 0 12px rgba(255,48,56,.12),

        inset 0 0 30px rgba(255,48,56,.055);

}


/* =========================================================
   婆婆子外框
   ========================================================= */

.post-item.bopo-card::before{

    border-radius:13px !important;

    border:
        1px solid rgba(255,100,90,.48) !important;

    box-shadow:

        0 0 5px rgba(255,55,55,.8),

        0 0 14px rgba(255,45,45,.55),

        0 0 28px rgba(255,45,45,.28) !important;
}


/* =========================================================
   婆婆子顶部反光
   ========================================================= */

.post-item.bopo-card::after{

    border-radius:50% !important;

    opacity:.48 !important;
}


/* =========================================================
   婆婆子文字
   ========================================================= */

.post-item.bopo-card .bopo-text{

    /*
       暖白，不偏粉
    */

    color:#fff8e8 !important;

    font-size:
        clamp(27px,5vw,38px) !important;

    font-weight:900 !important;

    letter-spacing:
        clamp(4px,1vw,9px) !important;

    line-height:1.4 !important;

    /*
       白色灯芯
       淡淡琥珀色外溢

       红色不染字
    */

    text-shadow:

        0 0 1px #ffffff,

        0 0 3px #ffffff,

        0 0 7px rgba(255,255,250,1),

        0 0 12px rgba(255,248,225,.96),

        0 0 20px rgba(255,220,175,.72),

        0 0 34px rgba(255,175,95,.42),

        0 0 52px rgba(255,125,45,.20) !important;
}


/* =========================================================
   重点：
   文案前后彻底取消横线 / “-”视觉
   ========================================================= */

.post-item.bopo-card .bopo-text::before,
.post-item.bopo-card .bopo-text::after{

    content:none !important;

    display:none !important;
}


/* =========================================================
   ③ 来日方长卡片
   通常就是首页 header
   ========================================================= */

.header{

    border-radius:16px !important;

    overflow:hidden !important;

    /*
       不改变原来的颜色体系
       只让它和下面的卡片拥有统一的圆角
    */

}


/* =========================================================
   ④ 普通帖子卡片
   ========================================================= */

.post-item:not(.bopo-card):not(.cyber-card){

    border-radius:16px !important;

    overflow:hidden !important;

    /*
       卡片之间留出更舒服的呼吸空间
    */

    margin-bottom:18px !important;

}


/* =========================================================
   普通帖子：标题
   ========================================================= */

.post-item:not(.bopo-card):not(.cyber-card) .title{

    display:block !important;

    margin-top:0 !important;

    margin-bottom:11px !important;

    line-height:1.72 !important;

}


/* =========================================================
   普通帖子：描述
   ========================================================= */

.post-item:not(.bopo-card):not(.cyber-card) .desc{

    display:block !important;

    margin-top:0 !important;

    margin-bottom:11px !important;

    line-height:1.72 !important;

}


/* =========================================================
   普通帖子：日期
   ========================================================= */

.post-item:not(.bopo-card):not(.cyber-card) .date{

    display:block !important;

    margin-top:0 !important;

    padding-top:2px !important;

    line-height:1.5 !important;

}


/* =========================================================
   普通帖子内部整体
   防止标题 / 描述 / 日期挤成一坨
   ========================================================= */

.post-item:not(.bopo-card):not(.cyber-card){

    line-height:1.65 !important;
}


/* =========================================================
   ⑤ cyber-card 也统一圆角
   ========================================================= */

.post-item.cyber-card{

    border-radius:16px !important;

    overflow:hidden !important;

    margin-bottom:18px !important;
}


/* =========================================================
   ⑥ 桌面端
   ========================================================= */

@media (min-width:701px){

    .post-item.bopo-card{

        min-height:200px !important;

function render() {

    const list = document.getElementById("postList");

    const specialPost = postsData.find(
        p => p.title === "婆婆子cyberpunk"
    );

    const normalPosts = postsData
        .filter(p => p.title !== "婆婆子cyberpunk")

            (a, b) =>

                new Date(a.date)
        );

    let html = "";

    // 婆婆子永远置顶
    if (specialPost) {
        html += `
            <a class="post-item bopo-card"
               href="${specialPost.link}">

                <div class="bopo-text">
                    真実はいつもひとつ！

            </a>
        `;
    }

    // 其他帖子继续按照最后更新时间排序
    html += normalPosts.map(p => `
        <a class="post-item ${p.special ? "cyber-card" : ""}" href="${p.link}">

            ${
                p.special
                ? `<div class="cyber-text">真実はいつもひとつ！</div>`
                : `
                    <div class="title">
                        ${p.title}
                    </div>

                    ${
                        p.desc

                        : ""
                    }

                    <div class="date">
                        最后更新 · ${p.date}
                    </div>

    /*

     * 婆婆子
     * 来日方长
     * MEMORY ARCHIVE
     * 普通帖子
     */

    const bopoCard = list.querySelector(".bopo-card");
    const header = document.querySelector(".header");
    const container = document.querySelector(".container");

    if (bopoCard && header && container) {
        container.insertBefore(bopoCard, header);
    }

    document.getElementById("postCount").textContent =
        postsData.length;
}

render();

</script>
